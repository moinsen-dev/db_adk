[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db_adk"
version = "0.1.0"
description = "Database-driven Agent Development Kit using Google ADK"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "google-adk>=0.3.0",
    "sqlalchemy>=2.0.40",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "click>=8.1.8",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
db-adk = "db_adk.api.cli:cli"
